  <title>Minerva</title>
  <link rel="icon" id="favicon" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    /* ===== Identidade visual (baseada nos slides azuis do Minerva) ===== */
    :root {
      --blue: #3372b6;
      --royal: #0033a0;
      --navy: #0b3d6b;
      --sky: #6fa8e6;
      --pale: #b8d1f5;
      --mist: #eef5fd;
      --line: #d6e4f5;
      --ok: #1f8f63;
      --bad: #c9453b;
      --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font-family: Barlow, system-ui, sans-serif;
      color: var(--navy);
      background: var(--mist);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr
    }

    h1,
    h2,
    h3 {
      font-family: var(--cond);
      text-transform: uppercase;
      line-height: 1.05
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: 0;
      background: none
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--sky);
      outline-offset: 2px
    }

    svg.i {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    /* ===== Painel (dash): seções do app e a tela de cada uma ===== */
    .dash {
      background: #fff;
      padding: 28px 22px;
      overflow-y: auto;
      height: 100vh;
      position: sticky;
      top: 0;
      border-right: 1px solid var(--line)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--royal)
    }

    .brand .mark {
      height: 54px
    }

    .brand h1 {
      font-size: 50px;
      color: var(--blue)
    }

    .dashed {
      border-top: 2px dashed var(--blue);
      margin: 12px 0 8px
    }

    .tag {
      font-family: var(--cond);
      color: var(--sky);
      font-size: 20px;
      line-height: 1.1
    }

    .dots {
      display: flex;
      gap: 6px;
      margin: 18px 0 12px
    }

    .dots i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--sky)
    }

    .ptitle {
      font-size: 30px;
      color: var(--blue)
    }

    .muted {
      font-size: 14px;
      opacity: .75;
      margin-top: 4px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 16px 0
    }

    .stat {
      background: var(--mist);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center
    }

    .stat b {
      display: block;
      font: 700 28px/1 var(--cond);
      color: var(--blue)
    }

    .stat span {
      font-size: 12px
    }

    .sec {
      display: grid;
      grid-template-columns: 46px 1fr;
      column-gap: 10px;
      row-gap: 4px;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 6px 18px 6px 18px;
      border: 1.5px solid var(--line);
      margin-bottom: 10px;
      background: #fff;
      transition: background .15s, border-color .15s
    }

    .sec:hover {
      border-color: var(--sky)
    }

    .sec.on {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff
    }

    .sec>* {
      grid-column: 2
    }

    .sec .n {
      grid-column: 1;
      grid-row: 1/span 4;
      font: 700 40px/1 var(--cond);
      color: var(--pale)
    }

    .sec.on .n {
      color: #fff
    }

    .sec h3 {
      font-size: 22px
    }

    .sec p {
      font-size: 14px
    }

    .sec small {
      font-size: 12px;
      opacity: .8
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px
    }

    .chips span {
      font-size: 12px;
      padding: 2px 9px;
      border-radius: 99px;
      background: var(--mist);
      color: var(--blue)
    }

    .sec.on .chips span {
      background: rgba(255, 255, 255, .2);
      color: #fff
    }

    .foot {
      margin-top: 14px;
      font-size: 12px
    }

    .x {
      display: none;
      position: absolute;
      right: 14px;
      top: 14px;
      font-size: 20px;
      padding: 6px 10px
    }

    /* ===== Celular com o app ===== */
    .stage {
      display: grid;
      place-items: center;
      padding: 24px
    }

    .phone {
      width: min(390px, 100%);
      height: min(820px, calc(100vh - 48px));
      background: var(--mist);
      border: 10px solid var(--navy);
      border-radius: 38px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 60px rgba(11, 61, 107, .28)
    }

    .top {
      display: grid;
      grid-template-columns: 1fr auto 34px;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #fff;
      border-bottom: 2px solid var(--line)
    }

    .top .logo {
      justify-self: start;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--royal)
    }

    .top .logo .mark {
      height: 28px
    }

    .top .logo span {
      font: 700 27px/1 var(--cond);
      color: var(--blue);
      text-transform: uppercase
    }

    .points-head {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      justify-self: end;
      border: 1px solid var(--pale);
      border-radius: 99px;
      padding: 4px 7px;
      color: var(--royal);
      background: var(--mist);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap
    }

    .points-head svg {
      color: var(--blue);
      width: 13px;
      height: 13px
    }

    .points-head[hidden] {
      display: none
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      display: grid;
      place-items: center;
      color: var(--blue);
      justify-self: end
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      font-size: 14px
    }

    .title {
      font-size: 29px;
      color: var(--blue);
      margin-bottom: 11px
    }

    .sub {
      font-size: 14px;
      opacity: .75;
      margin: -6px 0 12px
    }

    .card {
      background: #fff;
      border-radius: 15px;
      padding: 13px;
      margin-bottom: 12px;
      border-top: 3px dashed var(--pale)
    }

    .card h2 {
      font-size: 23px;
      color: var(--blue);
      margin-bottom: 6px
    }

    .hero {
      background: linear-gradient(135deg, var(--blue), var(--navy));
      color: #fff;
      border-radius: 22px 22px 6px 22px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .hero small {
      font-size: 13px;
      opacity: .85
    }

    .hero b {
      display: block;
      font: 700 42px/1 var(--cond)
    }

    .hero div>span {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      opacity: .78
    }

    .btn {
      display: block;
      margin: 14px auto 0;
      background: var(--blue);
      color: #fff;
      border-radius: 99px;
      padding: 10px 22px;
      font: 700 18px var(--cond);
      letter-spacing: .03em
    }

    .btn.light {
      background: #fff;
      color: var(--blue)
    }

    .btn.ghost {
      background: #fff;
      color: var(--blue);
      border: 2px solid var(--blue)
    }

    .hero .btn {
      margin: 0;
      padding: 9px 15px;
      font-size: 16px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line)
    }

    .row:last-child {
      border: 0
    }

    .row.me {
      background: var(--mist);
      border-radius: 10px;
      padding: 9px 8px;
      margin: 0 -8px
    }

    .grow {
      flex: 1;
      min-width: 0
    }

    .grow small {
      display: block;
      opacity: .7
    }

    .study-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
      margin-right: 7px;
      font-size: 11px;
      font-weight: 600
    }

    .study-status.studied {
      color: var(--ok)
    }

    .study-status.not-yet {
      color: #7c8da1
    }

    .study-status svg {
      width: 12px;
      height: 12px
    }

    .streak-inline {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #a45f2c;
      font-size: 11px;
      font-weight: 600
    }

    .streak-inline svg {
      width: 12px;
      height: 12px
    }

    .weekly-xp {
      flex: none;
      min-width: 48px;
      text-align: right
    }

    .weekly-xp b,
    .weekly-xp small {
      display: block
    }

    .weekly-xp b {
      color: var(--ink);
      font: 700 13px/1 var(--cond)
    }

    .weekly-xp small {
      margin-top: 2px;
      font-size: 9px;
      opacity: .62;
      text-transform: uppercase
    }

    .av {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--pale);
      display: grid;
      place-items: center;
      font-size: 16px;
      flex: none;
      color: var(--royal)
    }

    .av svg {
      width: 17px;
      height: 17px
    }

    .pos {
      font: 700 22px var(--cond);
      color: var(--sky);
      width: 16px;
      text-align: center
    }

    .news {
      padding: 9px 0;
      border-bottom: 1px solid var(--line)
    }

    .news:last-child {
      border: 0
    }

    .news small {
      color: var(--blue);
      font-weight: 600
    }

    .mini {
      border: 2px solid var(--blue);
      color: var(--blue);
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 13px;
      font-weight: 600
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      align-items: start;

      margin-bottom: 10px
    }

    .journey-head h2 {
      margin: 0

    .journey-head span {
      flex: none;
      border-radius: 99px;
      padding: 4px 8px;

      background: var(--mist);
      font-size: 11px;
      font-weight: 700
    }

      position: relative;
      display: grid;
      gap: 4px

    .journey-list::before {

      width: 2px;
      background: var(--line)

    .journey-step {
      position: relative;

      grid-template-columns: 36px 1fr auto;
      align-items: center;
      gap: 10px;

    .journey-dot {
      width: 36px;

    }

    .area-score {

      padding: 1px 1px 15px;

      scrollbar-width: none;

      padding: 13px 13px 22px 18px;
      border: 1.5px solid var(--line);
      border-radius: 7px 19px 19px 7px;
      background: #fff;
      box-shadow: inset 6px 0 var(--pack);
      transition: transform .15s, border-color .15s

    .continue-pack:hover {

    .continue-icon {

    .continue-copy b {

    .continue-pack .pack-progress {

    .q {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35
    }

    .opt {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 10px 11px;
      border-radius: 15px;
      border: 2px solid var(--pale);
      background: #fff;
      margin-bottom: 10px;
      transition: border-color .15s, background .15s

    .opt b {

    .fb {

    .answer-feedback.correct {
      border-top-color: var(--ok);
      background: #f2fbf7
    }

    .answer-feedback.wrong {
      border-top-color: var(--bad);
      background: #fff7f6
    }

    .feedback-head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 7px
    }

    .feedback-head h2 {
      margin: 0
    }

    .feedback-icon {

      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff

    .correct .feedback-icon {
      background: var(--ok)
    }

    .wrong .feedback-icon {
      background: var(--bad)
    }

    .feedback-icon svg {
      width: 18px;
      height: 18px
    }

    .earned {
      display: flex;
      gap: 7px;
      margin-top: 11px
    }

    .earned span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 99px;
      padding: 5px 9px;
      color: var(--ok);
      background: #fff;
      border: 1px solid #cce9dc;
      font-size: 12px;
      font-weight: 700
    }

    .earned svg {
      width: 13px;
      height: 13px
    }

    .center {
      text-align: center
    }

    .big {
      font: 700 64px/1 var(--cond);
      color: var(--blue);
      margin: 4px 0

    .quiz-premium-note {

      grid-template-columns: 28px 1fr auto;

    }

    .quiz-premium-copy {
      min-width: 0;
      text-align: left
    }

    .quiz-premium-copy b,
    .quiz-premium-copy small {
      display: block
    }

    .quiz-premium-copy b {
      font-size: 12px
    }

    .quiz-premium-copy small {

      padding: 10px 14px;
      font: inherit;
      color: inherit
    }

    .add .btn {
      margin: 0;
      padding: 8px 16px
    }

    /* ===== Recompensas: pontos de estudo viram vouchers ===== */
    .wallet {
      position: relative;
      overflow: hidden;
      background: var(--navy);
      color: #fff;
      border-radius: 22px 22px 6px 22px;
      padding: 16px;
      margin-bottom: 12px
    }

    .wallet-watermark {
      position: absolute;
      right: -10px;
      bottom: -24px;
      width: 112px;
      height: 112px;
      color: #fff;
      opacity: .08;
      transform: rotate(-8deg);
      stroke-width: 1.2
    }

    .wallet small,
    .wallet span {
      position: relative;
      z-index: 1
    }

    .wallet small {
      display: block;
      opacity: .8
    }

    .wallet b {
      position: relative;
      z-index: 1;
      display: block;
      font: 700 44px/1 var(--cond);
      margin: 2px 0 8px
    }

    .wallet span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .12);
      font-size: 12px
    }

    .wallet span svg {
      width: 12px;
      height: 12px
    }

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 1px 1px 10px;
      scrollbar-width: none;
      overscroll-behavior-inline: contain;
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch
    }

    .drag-scroll.is-grabbing {
      cursor: grabbing;
      scroll-snap-type: none
    }

    .filters::-webkit-scrollbar {
      display: none
    }

    .filter {
      flex: none;
      border: 1.5px solid var(--pale);
      border-radius: 99px;
      background: #fff;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600
    }

    .filter.on {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue)
    }

    .rewards {
      display: grid;
      gap: 9px

    .voucher {
      --voucher: var(--blue);
      position: relative;
      width: calc(100% - 10px);
      margin-inline: auto;
      display: grid;
      grid-template-columns: 58px 1fr auto;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-align: left;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 15px 5px 15px 15px;
      padding: 9px 9px 9px 0;
      transition: transform .15s, border-color .15s
    }

    .voucher:hover {
      transform: translateY(-2px);
      border-color: var(--voucher)
    }

    .voucher.unavailable {
      background: #f2f4f6;
      border-color: #d4dbe2;
      filter: grayscale(.72);
      opacity: .72
    }

    .voucher.unavailable:hover {
      border-color: #9aa8b6;
      filter: grayscale(.55);
      opacity: .86
    }

    .voucher::before,
    .voucher::after {
      content: '';
      position: absolute;
      left: 51px;
      width: 9px;

        <span class="league-icon"><i data-lucide="${item.icon}"></i></span><span class="league-copy"><b>${item.name}</b>
          <small>${item.members.length} participantes</small></span></button>`).join('')}</div>
    <div class="card league-ranking"><div class="league-ranking-head"><div><h2>${league.name}</h2><small>Sequência · atividade de hoje · XP semanal</small></div>
      <span>${myPosition}º lugar</span></div>${rank(league.members)}
      <p class="ranking-note"><i data-lucide="info"></i>O ranking é ordenado pela sequência de dias estudados. Em caso de empate, vence quem tem mais XP na semana.</p></div>
    <div class="section-heading"><h2>Todos os amigos</h2><small>${F.length} amigos</small></div>
    <div class="card">${F.map(friend => {
        const friendLeagues = LEAGUES.filter(item => item.members.includes(friend[1]));
        return `<div class="row"><span class="av"><i data-lucide="${friend[0]}"></i></span>
        <div class="grow"><b>${esc(friend[1])}</b><div><span class="study-status ${friend[4] ? 'studied' : 'not-yet'}"><i data-lucide="${friend[4] ? 'circle-check' : 'clock-3'}"></i>${friend[4] ? 'Estudou hoje' : 'Ainda não estudou'}</span><span class="streak-inline"><i data-lucide="flame"></i>${friend[3]} dias</span></div>
          <div class="friend-leagues">${friendLeagues.length ? friendLeagues.map(item => `<span>${item.short}</span>`).join('') : '<span class="no-league">Sem Liga</span>'}</div></div>
        <button class="mini" data-act="duel">Desafiar</button></div>`;
      }).join('')}</div>
    ${adding
          ? `<form class="add"><input name="nome" placeholder="Nome do amigo" aria-label="Nome do amigo" autocomplete="off" required>
         <button class="btn" type="submit">Adicionar</button></form>`
          : `<button class="btn" data-act="add">Adicionar amigos</button>`}`;
    };

    const screens = {
      home: () => `
    <div class="hero"><div><small>${STUDENT.cycle} · ${STUDENT.grade}ª série</small><b>${STUDENT.readiness}%</b><span>preparado para a etapa atual</span></div>
      <button class="btn light" data-go="materias">Continuar</button></div>
    ${premiumInvite('home')}
    ${journeyView()}
    ${homeLeagueRanking()}
    ${continueStudies()}
    ${areaProgress()}
    <div class="card"><h2>Notícias Relevantes </h2>${NEWS.map(n => `<div class="news"><small>${n[0]}</small><br>${n[1]}</div>`).join('')}</div>
    <div class="card"><h2>Novidades do Minerva</h2>${NOVIDADES.map(n => `<div class="news"><b>${n[0]}</b><br>${n[1]}</div>`).join('')}</div>`,

      materias: packsScreen,

      quiz: () => {
        const s = Q[quiz.m], d = s.q[quiz.i];
        if (quiz.fim) return `
      <h2 class="title">${quiz.m}</h2>
      <div class="card center"><h2>Resultado</h2><div class="big">${quiz.ac}/${s.q.length}</div>
        ${quiz.ac === s.q.length
            ? '<p>Mandou bem! Continue assim para manter a sequência.</p>'
            : `<div class="quiz-premium-note"><span><i data-lucide="sparkles"></i></span><span class="quiz-premium-copy"><b>Revisão focada com IA</b><small>Revisão dos seus pontos fracos de ${quiz.m}, exclusiva para Aprendizes Premium.</small></span><button class="mini" data-go="premium">Conhecer</button></div>`}
        <button class="btn" data-go="materias">Escolher outro pacote</button>
        <button class="btn ghost" data-act="again">Refazer quiz</button></div>`;
        const done = quiz.r !== null, last = quiz.i === s.q.length - 1, isCorrect = quiz.r === d[2];
        return `
      <h2 class="title">${quiz.m}</h2>
      <p class="sub">Questão ${quiz.i + 1} de ${s.q.length}</p>
      <div class="card"><p class="q">${d[0]}</p></div>
      ${d[1].map((t, j) => `<button class="opt ${done ? (j === d[2] ? 'ok' : j === quiz.r ? 'bad' : '') : ''}" data-opt="${j}" ${done ? 'disabled' : ''}>
        <b>${'ABCD'[j]}</b><span>${t}</span></button>`).join('')}
      ${done ? `<div class="card answer-feedback ${isCorrect ? 'correct' : 'wrong'}">
        <div class="feedback-head"><span class="feedback-icon"><i data-lucide="${isCorrect ? 'check' : 'circle-alert'}"></i></span>
          <h2>${isCorrect ? 'Resposta correta' : 'Quase lá'}</h2></div><p>${d[3]}</p>
        ${isCorrect ? `<div class="earned"><span><i data-lucide="zap"></i>+10 XP</span><span><i data-lucide="star"></i>+20 pontos</span></div>` : ''}</div>
        <button class="btn" data-act="next">${last ? 'Ver resultado' : 'Próxima questão'}</button>` : ''}`;
      },

      recompensas: rewardsScreen,

      premium: premiumScreen,

      configuracoes: settingsScreen,

      amigos: friendsScreen
    };

    /* ===== Navegação e renderização ===== */
    function enableDragScroll(el, scrollKey) {
      let pointerId = null, startX = 0, startScroll = 0, dragging = false, suppressClickUntil = 0;
      el.classList.add('drag-scroll');

      el.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        pointerId = e.pointerId;
        startX = e.clientX;
        startScroll = el.scrollLeft;
        dragging = false;
        el.classList.add('is-grabbing');
        if (el.setPointerCapture) el.setPointerCapture(pointerId);
      });

      el.addEventListener('pointermove', e => {
        if (e.pointerId !== pointerId) return;
        const distance = e.clientX - startX;
        if (Math.abs(distance) > 5) {
          dragging = true;
          suppressClickUntil = performance.now() + 300;
        }
        if (!dragging) return;
        el.scrollLeft = startScroll - distance;
        horizontalScroll[scrollKey] = el.scrollLeft;
        e.preventDefault();
      });

      const finishDrag = e => {
        if (e.pointerId !== pointerId) return;
        if (dragging) suppressClickUntil = performance.now() + 300;
        pointerId = null;
        dragging = false;
        el.classList.remove('is-grabbing');
      };

      el.addEventListener('pointerup', finishDrag);
      el.addEventListener('pointercancel', finishDrag);
      el.addEventListener('lostpointercapture', finishDrag);
      el.addEventListener('scroll', () => { horizontalScroll[scrollKey] = el.scrollLeft; }, { passive: true });
      el.addEventListener('click', e => {
        if (performance.now() > suppressClickUntil) return;
        e.preventDefault();
        e.stopPropagation();
      }, true);
    }

    function draw(keepScroll) {
      const el = $('#screen');
      el.innerHTML = screens[cur]();
      if (!keepScroll) el.scrollTop = 0;
      const navId = cur === 'quiz' ? 'materias' : cur;
      document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.go === navId));
      const pointsHead = $('#headerPoints');
      $('#headerPointsValue').textContent = fmt(points);
      pointsHead.setAttribute('aria-label', `Ver recompensas, ${fmt(points)} pontos`);
      if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.8 } });
      [['.league-scroll', 'leagues'], ['.continue-track', 'continueStudies'], ['.filters', 'rewardFilters']].forEach(([selector, scrollKey]) => {
        const scroller = el.querySelector(selector);
        if (!scroller) return;
        scroller.scrollLeft = horizontalScroll[scrollKey];
        enableDragScroll(scroller, scrollKey);
      });
      const inp = el.querySelector('.add input'); if (inp) inp.focus();
    }

    function go(id, arg) {
      if (id === 'quiz') {
        quiz = { m: Q[arg] ? arg : 'Matemática', i: 0, ac: 0, r: null, fim: false };
        const pack = PACKS.find(item => item.id === packSelected);
        if (pack) pack.started = true;
      }
      if (id === 'materias') packSelected = null;
      if (id === 'recompensas') { rewardSelected = null; rewardRedeemed = null; }
      adding = false; cur = id; draw();
    }

    let tt;
    function toast(msg, kind = 'info', detail = '') {
      const t = $('#toast');
      t.className = `toast${kind === 'success' ? ' success' : ''}`;
      if (kind === 'success') {
        t.innerHTML = `<span class="toast-icon"><i data-lucide="check"></i></span><span class="toast-copy"><b>${msg}</b><small>${detail}</small></span>`;
        if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.8 }, root: t });
      } else t.textContent = msg;
      t.classList.add('show');
      clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), kind === 'success' ? 2800 : 2000);
    }

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-go],[data-opt],[data-act],[data-filter],[data-reward],[data-pack],[data-setting],[data-league]');
      if (!t) return;
      const d = t.dataset;
      if (d.go) go(d.go, d.arg);
      else if (d.pack) { cur = 'materias'; packSelected = d.pack; draw(); }
      else if (d.league) {
        selectedLeague = d.league;
        const leagueIndex = LEAGUES.findIndex(item => item.id === d.league);
        if (leagueIndex >= 0) homeLeagueIndex = leagueIndex;
        draw(true);
      }
      else if (d.setting) {
        preferences[d.setting] = !preferences[d.setting];
        if (d.setting === 'largeText') document.body.classList.toggle('large-text', preferences.largeText);
        draw(true);
      }
      else if (d.filter) { rewardFilter = d.filter; draw(true); }
      else if (d.reward) { rewardSelected = d.reward; rewardRedeemed = null; draw(); }
      else if (d.opt !== undefined && quiz.r === null) {
        const k = +d.opt, q = Q[quiz.m].q[quiz.i];
        quiz.r = k;
        if (k === q[2]) { quiz.ac++; weeklyXp += 10; points += 20; toast('Resposta correta', 'success', '+10 XP semanal · +20 pontos'); }
        draw(true);
      }
      else if (d.act === 'next') {
        if (quiz.i < Q[quiz.m].q.length - 1) { quiz.i++; quiz.r = null; }
        else {
          quiz.fim = true;
          prog[quiz.m] = Math.min(100, prog[quiz.m] + 10);
          STUDENT.readiness = Math.min(100, STUDENT.readiness + 1);
          const area = AREA_PROGRESS.find(item => item[0] === SUBJECT_AREA[quiz.m]);
          if (area) area[1] = Math.min(100, area[1] + 2);
          const pack = PACKS.find(item => item.id === packSelected);
          if (pack) pack.progress = Math.min(100, pack.progress + 10);
        }
        draw();
      }
      else if (d.act === 'again') go('quiz', quiz.m);
      else if (d.act === 'add') { adding = true; draw(true); }
      else if (d.act === 'duel') toast('Desafio enviado (simulado)');
      else if (d.act === 'create-league') toast('Criação de Ligas disponível em breve');
      else if (d.act === 'previous-home-league') {
        homeLeagueIndex = (homeLeagueIndex - 1 + LEAGUES.length) % LEAGUES.length;
        selectedLeague = LEAGUES[homeLeagueIndex].id;
        draw(true);
      }
      else if (d.act === 'next-home-league') {
        homeLeagueIndex = (homeLeagueIndex + 1) % LEAGUES.length;
        selectedLeague = LEAGUES[homeLeagueIndex].id;
        draw(true);
      }
      else if (d.act === 'premium-checkout') toast('Abrindo checkout...', 'success', 'Prepare-se para ser uma Aprendiz Premium');
      else if (d.act === 'edit-profile') toast('Edição de perfil disponível em breve');
      else if (d.act === 'privacy') toast('Configurações de privacidade em breve');
      else if (d.act === 'help') toast('Central de ajuda disponível em breve');
      else if (d.act === 'logout') toast('Saída da conta simulada');
      else if (d.act === 'pack-back') { packSelected = null; draw(); }
      else if (d.act === 'create-pack') toast('Criação de pacotes disponível em breve');
      else if (d.act === 'rewards-back') { rewardSelected = null; rewardRedeemed = null; draw(); }
      else if (d.act === 'redeem') {
        const r = REWARDS.find(item => item.id === rewardSelected);
        if (r && points >= r.cost) { points -= r.cost; rewardRedeemed = r.id; draw(); toast('Voucher resgatado'); }
      }
      else if (d.act === 'copy-code') {
        if (navigator.clipboard) navigator.clipboard.writeText('MINERVA-2841').catch(() => { });
        toast('Código copiado');
      }
    });

    document.addEventListener('submit', e => {
      e.preventDefault();
      const nome = e.target.nome.value.trim();
      if (nome) {
        const studiedToday = Math.random() < .65;
        const friendStreak = studiedToday ? 1 + Math.floor(Math.random() * 14) : Math.floor(Math.random() * 15);
        const friendWeeklyXp = Math.floor(Math.random() * 61) * 10;
        F.push(['user-round', nome, friendWeeklyXp, friendStreak, studiedToday]);
        toast('Amigo adicionado', 'success');
      }
      adding = false; draw(true);
    });

    /* ===== Início ===== */
    const logoUrl = getComputedStyle($('.mark')).backgroundImage.match(/^url\(["']?(.*?)["']?\)$/)?.[1];
    if (logoUrl) $('#favicon').href = logoUrl;
    draw();
  </script>
</body>

</html>
